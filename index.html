<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Financial Position — Home</title>
<link rel="icon" href="logo.png"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background:#f5f6f8; margin:0; font-family:system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .home-hero { text-align:center; padding:40px 20px 10px; }
  .home-hero img { height:64px; }
  .home-hero h1 { color:#111; margin:12px 0 4px; }
  .home-hero p { color:#475569; margin:0; }
  .home-tiles {
    display:grid; grid-template-columns:repeat(2,1fr); gap:20px;
    max-width:720px; margin:32px auto; padding:0 20px;
  }
  .tile {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#fff; border:1px solid #e5e7eb; border-radius:12px;
    padding:36px 20px; text-decoration:none; color:#111;
    box-shadow:0 1px 3px rgba(0,0,0,.06); transition:transform .15s, box-shadow .15s;
  }
  .tile:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.08); }
  .tile .icon { font-size:48px; margin-bottom:12px; }
  .tile .label { font-size:18px; font-weight:600; }
  .tile .desc { font-size:13px; color:#475569; margin-top:4px; text-align:center; }
  @media (max-width:480px){ .home-tiles{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header class="home-hero">
  <img src="logo.png" alt="logo"/>
  <h1>Financial Position</h1>
  <p>Choose a section to get started.</p>
</header>

<main class="home-tiles">
  <a class="tile" href="records.html">
    <div class="icon">📒</div>
    <div class="label">Records</div>
    <div class="desc">Cash In, Expenses &amp; Monthly tracking</div>
  </a>
  <a class="tile" href="reports.html">
    <div class="icon">💳</div>
    <div class="label">Debt</div>
    <div class="desc">Track outstanding debts &amp; export to Excel</div>
  </a>
</main>

</body>
</html>
