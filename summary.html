<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Summary</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<nav class="navbar">
  <h2>💰 My Finance</h2>
  <ul>
    <li><a href="index.html">Financial Position</a></li>
    <li><a href="expenses.html">Expenses</a></li>
    <li><a href="records.html">Records</a></li>
    <li><a href="summary.html" class="active">Summary</a></li>
  </ul>
</nav>

<main class="container">
  <h1>Summary</h1>
  <div class="grid">
    <div class="card"><h2>Income</h2><div class="big-number" id="sumIncome">0.00</div></div>
    <div class="card"><h2>Debts</h2><div class="big-number" id="sumDebts">0.00</div></div>
    <div class="card"><h2>Expenses (cycle)</h2><div class="big-number" id="sumExp">0.00</div></div>
    <div class="card result">
      <h2>Cash Status (cycle)</h2>
      <div class="big-number" id="sumCash">0.00</div>
      <p id="sumCashNote" class="note">Total Income − Total Expenses (current cycle)</p>
    </div>
    <div class="card result"><h2>Net Position</h2><div class="big-number" id="sumNet">0.00</div></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="app.js"></script>
</body>
</html>
