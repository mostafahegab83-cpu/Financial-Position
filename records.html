<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Records</title>
<link rel="stylesheet" href="styles.css"/>
<style>
  .month-table { width:100%; border-collapse:collapse; }
  .month-table th, .month-table td { border:1px solid #ddd; padding:10px; vertical-align:top; }
  .month-table th { background:#f5f5f5; text-align:left; }
  .month-totals { font-size:12px; color:#555; margin-top:4px; }
  .inline-add { display:flex; flex-direction:column; gap:4px; min-width:160px; }
  .inline-add input { padding:5px 7px; font-size:13px; width:100%; box-sizing:border-box; }
  .inline-add .btn { align-self:flex-start; }
  .detail-row { background:#fafafa; }
  .detail-row td { padding:10px 14px; }
  .mini-form { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .mini-form input { padding:4px 6px; font-size:13px; }
  .mini-list { margin:6px 0 10px; padding-left:18px; font-size:13px; }
  .pos { color:#1a7f37; } .neg { color:#b42318; }
  @media (max-width: 720px) {
    .month-table thead { display:none; }
    .month-table tr { display:block; margin-bottom:14px; border:1px solid #ddd; }
    .month-table td { display:block; border:none; border-bottom:1px solid #eee; }
    .month-table td:before { content: attr(data-label); font-weight:600; display:block; font-size:12px; color:#666; }
  }
</style>
</head>
<body>
<nav class="navbar">
  <h2>💰 My Finance</h2>
  <ul>
    <li><a href="index.html">Financial Position</a></li>
    <li><a href="records.html" class="active">Records</a></li>
    <li><a href="reports.html">Reports</a></li>
  </ul>
</nav>

<main class="container">
  <h1>Financial Monthly Tracker</h1>
  <p class="subtitle">Add multiple Cash In / Expenses per month. Remaining = (previous remaining + cash in) − expenses.</p>

  <section class="card">
    <div class="row">
      <label>Year
        <select id="yearSelect" onchange="onChangeYear()"></select>
      </label>
    </div>

    <table class="month-table" id="recordsTable">
      <thead>
        <tr>
          <th>Month</th>
          <th>Cash In</th>
          <th>Expenses</th>
          <th>Month Remaining Cash</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="app.js"></script>
</body>
</html>
