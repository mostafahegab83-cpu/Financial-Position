<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Records</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<nav class="navbar">
  <h2>💰 My Finance</h2>
  <ul>
    <li><a href="index.html">Financial Position</a></li>
    <li><a href="expenses.html">Expenses</a></li>
    <li><a href="records.html" class="active">Records</a></li>
    <li><a href="reports.html">Reports</a></li>
    <li><a href="summary.html">Summary</a></li>
  </ul>
</nav>

<main class="container">
  <h1>Records</h1>
  <p class="subtitle">Edit, delete, or filter saved entries.</p>

  <section class="card">
    <h2>Income</h2>
    <div class="row">
      <label>From <input type="date" id="incFrom"/></label>
      <label>To <input type="date" id="incTo"/></label>
      <button class="btn primary" onclick="applyIncomeFilter()">Filter</button>
      <button class="btn" onclick="clearIncomeFilter()">Clear</button>
      <span class="note">Filtered total: <strong id="incFilterTotal">0.00</strong></span>
    </div>
    <table class="table" id="incomeTable">
      <thead><tr><th>Date</th><th>Label</th><th>Amount</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card">
    <h2>Debts</h2>
    <table class="table" id="debtTable">
      <thead><tr><th>Label</th><th>Amount</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card">
    <h2>Expenses</h2>
    <div class="row">
      <label>From <input type="date" id="expFrom"/></label>
      <label>To <input type="date" id="expTo"/></label>
      <button class="btn primary" onclick="applyExpenseFilter()">Filter</button>
      <button class="btn" onclick="clearExpenseFilter()">Clear</button>
      <span class="note">Filtered total: <strong id="expFilterTotal">0.00</strong></span>
    </div>
    <table class="table" id="expensesTable">
      <thead><tr><th>Date</th><th>Name</th><th>Amount</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="app.js"></script>
</body>
</html>
