    <table class="table" id="incomeTable">
      <thead><tr><th>Label</th><th>Amount</th><th>Actions</th></tr></thead>

    <table class="table" id="debtTable">

  <section class="card">
    <h2>Expense Records</h2>
    <table class="table" id="expensesTable">
      <thead><tr><th>Date</th><th>Name</th><th>Amount</th><th>Actions</th></tr></thead>
