<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Debts Report</title>
<link rel="icon" href="logo.png"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background:#f5f6f8; }
  .container h1 { color:#111; text-align:center; }
  .subtitle { color:#475569; text-align:center; }
  .debt-form { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px; }
  .debt-form label { display:block; font-weight:600; font-size:14px; margin-bottom:6px; color:#111; }
  .debt-form input { width:100%; padding:10px 12px; border:1px solid #d9d9d9; border-radius:6px; font-size:14px; }
  .add-debt-btn {
    display:block; width:100%; background:#2563eb; color:#fff; border:none;
    padding:14px; border-radius:6px; font-size:15px; font-weight:600; cursor:pointer;
    margin-bottom:22px;
  }
  .add-debt-btn:hover { background:#1d4ed8; }
  .debts-table { width:100%; border-collapse:collapse; background:#fff; }
  .debts-table th, .debts-table td { padding:12px; border-bottom:1px solid #eee; font-size:14px; }
  .debts-table th { text-align:left; background:#f9fafb; color:#374151; }
  .debts-table th.num, .debts-table td.num { text-align:right; }
  .debts-table tfoot th { background:#eff6ff; font-weight:700; color:#1e3a8a; }
  .debts-table input { width:100%; padding:6px 8px; border:1px solid #d9d9d9; border-radius:4px; font-size:13px; }
  .debts-table .btn.primary { background:#2563eb; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; margin-right:4px; }
  .debts-table .btn.danger { background:#dc2626; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
  .debts-table .btn { padding:6px 12px; border-radius:4px; margin-right:4px; }
  .actions { white-space:nowrap; }
  @media (max-width: 600px) { .debt-form { grid-template-columns:1fr; } }
</style>
</head>
<body>
<nav class="navbar">
  <h2><img src="logo.png" alt="logo" style="height:32px;vertical-align:middle;margin-right:8px"/>Finance Tracker</h2>
  <ul>
    <li><a href="records.html">Records</a></li>
    <li><a href="reports.html" class="active">Reports</a></li>
  </ul>
</nav>

<main class="container">
  <h1>Debts</h1>
  <p class="subtitle">Track all outstanding debts and view the total.</p>

  <section class="card">
    <div class="debt-form">
      <div>
        <label for="debtInput">Amount</label>
        <input type="number" id="debtInput" min="0.01" step="0.01" placeholder="Amount" />
      </div>
      <div>
        <label for="debtLabel">Description</label>
        <input type="text" id="debtLabel" placeholder="Description" />
      </div>
    </div>
    <button class="add-debt-btn" onclick="addDebt()">+ Add Debt</button>

    <table class="debts-table" id="debtsReportTable">
      <thead><tr><th class="num">Amount</th><th>Description</th><th>Actions</th></tr></thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <th class="num" id="debtsTotal">0.00</th>
          <th>Total</th>
          <th></th>
        </tr>
      </tfoot>
    </table>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="app.js"></script>
</body>
</html>
